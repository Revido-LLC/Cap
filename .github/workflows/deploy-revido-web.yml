name: "Deploy Revido Web"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "infrastructure/*.sh"
      - "infrastructure/*.md"
      - "**.md"

jobs:
  build:
    name: Build Web Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          echo "WEB_URL=http://localhost:3000" > .env
          echo "NEXT_PUBLIC_DOCKER_BUILD=true" >> .env

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase GITHUB_REPOSITORY_OWNER
        run: |
          echo "REPOSITORY_OWNER=${GITHUB_REPOSITORY_OWNER@L}" >>${GITHUB_ENV}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.REPOSITORY_OWNER }}/cap-web:latest,ghcr.io/${{ env.REPOSITORY_OWNER }}/cap-web:${{ github.sha }}
          cache-from: type=gha,scope=revido-web
          cache-to: type=gha,mode=max,scope=revido-web

  deploy:
    name: Deploy to Coolify
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy cap-web container (zero-downtime)
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SERVER: ${{ secrets.HETZNER_HOST }}
          SERVICE_UUID: ${{ secrets.COOLIFY_SERVICE_UUID }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key

          ssh -i ~/.ssh/key -o StrictHostKeyChecking=no "root@${SERVER}" \
            "set -euo pipefail && \
             echo 'Pulling new image...' && \
             docker pull ghcr.io/revido-llc/cap-web:latest && \
             echo 'Recreating cap-web only (other services stay running)...' && \
             docker compose -f /data/coolify/services/${SERVICE_UUID}/docker-compose.yml up -d --no-deps --force-recreate cap-web && \
             echo 'Waiting for health check...' && \
             for i in \$(seq 1 30); do \
               STATUS=\$(docker inspect --format='{{.State.Health.Status}}' cap-web-${SERVICE_UUID} 2>/dev/null || echo 'starting'); \
               if [ \"\$STATUS\" = 'healthy' ]; then echo \"cap-web healthy after \${i}s\"; exit 0; fi; \
               sleep 1; \
             done && \
             echo 'WARNING: cap-web not healthy within 30s' && \
             docker logs --tail 20 cap-web-${SERVICE_UUID} 2>/dev/null && \
             exit 1"
