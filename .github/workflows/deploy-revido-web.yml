name: "Deploy Revido Web"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "infrastructure/**"
      - "**.md"

jobs:
  build:
    name: Build Web Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          echo "WEB_URL=http://localhost:3000" > .env
          echo "NEXT_PUBLIC_DOCKER_BUILD=true" >> .env

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase GITHUB_REPOSITORY_OWNER
        run: |
          echo "REPOSITORY_OWNER=${GITHUB_REPOSITORY_OWNER@L}" >>${GITHUB_ENV}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ env.REPOSITORY_OWNER }}/cap-web:latest,ghcr.io/${{ env.REPOSITORY_OWNER }}/cap-web:${{ github.sha }}
          cache-from: type=gha,scope=revido-web
          cache-to: type=gha,mode=max,scope=revido-web

  deploy:
    name: Deploy to Coolify
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest image and restart
        run: |
          curl -s -X GET \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            "https://coolify.revido.co/api/v1/services/${{ secrets.COOLIFY_SERVICE_UUID }}/stop"
          sleep 5
          curl -s -X GET \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            "https://coolify.revido.co/api/v1/services/${{ secrets.COOLIFY_SERVICE_UUID }}/start"
