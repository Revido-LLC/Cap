name: "Sync Secrets (Infisical → Coolify)"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Infisical environment to sync from"
        required: true
        default: "prod"
        type: choice
        options:
          - staging
          - prod
      restart_service:
        description: "Restart Coolify service after sync?"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Preview changes without pushing?"
        required: false
        default: false
        type: boolean

jobs:
  sync:
    name: Sync Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo bash
          sudo apt-get update && sudo apt-get install -y infisical

      - name: Authenticate and sync
        env:
          CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
          INFISICAL_API_URL: https://infisical.revido.co/api
          INFISICAL_PROJECT_ID: 63361c35-8075-49d3-b3b6-1d4ff4b31517
          INFISICAL_ENVIRONMENT: ${{ inputs.environment }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_API_URL: https://coolify.revido.co
          COOLIFY_SERVICE_UUID: ls45v38pyyqi74mdl8w0bw2a
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_RESTART: ${{ inputs.restart_service }}
        run: |
          INFISICAL_TOKEN=$(curl -s --connect-timeout 10 --max-time 30 -X POST \
            "https://infisical.revido.co/api/v1/auth/universal-auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"clientId\": \"${CLIENT_ID}\", \"clientSecret\": \"${CLIENT_SECRET}\"}" \
            | jq -r '.accessToken')

          if [[ -z "$INFISICAL_TOKEN" || "$INFISICAL_TOKEN" == "null" ]]; then
            echo "ERROR: Failed to authenticate with Infisical" >&2
            exit 1
          fi

          echo "::add-mask::${INFISICAL_TOKEN}"
          export INFISICAL_TOKEN

          chmod +x infrastructure/sync-secrets.sh
          FLAGS=()
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then FLAGS+=(--dry-run); fi
          if [[ "$INPUT_RESTART" == "true" ]]; then FLAGS+=(--restart); fi
          ./infrastructure/sync-secrets.sh "${FLAGS[@]+"${FLAGS[@]}"}"
